[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armos"
version = "0.1.0"
description = "MuJoCo simulation framework for the CyRo tri-arm robotic system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

authors = [
    { name = "armos contributors" }
]

keywords = [
    "robotics",
    "simulation",
    "mujoco",
    "tri-arm",
    "cyro",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Robotics",
]

dependencies = [
    "mujoco>=3.5.0",
    "numpy>=1.26,<2.0",,
    "PyYAML>=6.0",
    "quadprog>=0.1.13",
    "trimesh>=4.11.2",
    "pycollada>=0.9.3",
    "opencv-contrib-python>=4.13.0.92",
    "gdown>=5.0",
]

[project.optional-dependencies]

# Pinocchio and Pink for task-space control
task-space = [
    "pin>=2.6",
    "pin-pink",
]

# ROS 2 dependencies are intentionally not installed through pip.
# rclpy comes from the ROS 2 installation.
ros2 = []

# Development dependencies
dev = [
    "pytest",
    "ruff",
]

# All optional development/task-space dependencies
all = [
    "pin>=2.6",
    "pin-pink",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = [
    "sim",
    "sim.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]